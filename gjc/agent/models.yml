profiles:
  cursor-codex:
    display_name: cursor-codex
    required_providers:
      - cursor
    model_mapping:
      default: cursor/gpt-5.6-sol-medium-fast
      executor: cursor/gpt-5.6-terra-medium
      planner: cursor/gpt-5.6-sol-high-fast
      critic: cursor/gpt-5.6-sol-max-fast
      architect: cursor/gpt-5.6-sol-xhigh-fast

  cursor-grok:
    display_name: cursor-grok
    required_providers:
      - cursor
    model_mapping:
      default: cursor/cursor-grok-4.5-high-fast
      executor: cursor/cursor-grok-4.5-medium-fast
      planner: cursor/cursor-grok-4.5-high-fast
      critic: cursor/cursor-grok-4.5-high-fast
      architect: cursor/cursor-grok-4.5-high-fast

  cursor-fable:
    display_name: cursor-fable
    required_providers:
      - cursor
      - openai-codex
    model_mapping:
      default: cursor/claude-fable-5-high
      executor: cursor/gpt-5.6-terra-medium
      architect: cursor/gpt-5.6-sol-xhigh-fast
      planner: cursor/gpt-5.6-sol-high-fast
      critic: openai-codex/gpt-5.6-sol:max
